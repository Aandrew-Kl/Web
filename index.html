<!doctype html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Andreas Klime | Συνεργασίες</title>
    <meta name="description" content="Εταιρείες και brands με τα οποία συνεργάζεται ο Andreas Klime." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="logo-page" aria-label="Συνεργασίες">
      <section class="logo-stage">
        <div class="logo-carousel" aria-label="Λογότυπα εταιρειών">
          <div class="logo-track">
            <a class="logo-item logo-item--lockup logo-item--alysis" href="https://alysisai.com/" target="_blank" rel="noopener noreferrer" aria-label="Άνοιγμα Alysis AI">
              <img src="assets/logos/alysis-ai.png" alt="Alysis AI" width="464" height="432" decoding="async" />
              <span>Alysis AI</span>
            </a>
            <a class="logo-item logo-item--lockup logo-item--sylliptor" href="https://sylliptor.alysisai.com/" target="_blank" rel="noopener noreferrer" aria-label="Άνοιγμα Sylliptor">
              <img class="logo-img--pixel" src="assets/logos/sylliptor.png" alt="Sylliptor" width="407" height="347" decoding="async" />
              <span>Sylliptor</span>
            </a>
            <a class="logo-item logo-item--lockup logo-item--synesis" href="https://esynesis.eu/" target="_blank" rel="noopener noreferrer" aria-label="Άνοιγμα Synesis Strategic Advisors">
              <img src="assets/logos/synesis.png" alt="Synesis Strategic Advisors" width="512" height="512" decoding="async" />
              <span><strong>Synesis</strong><small>Strategic Advisors</small></span>
            </a>
            <a class="logo-item logo-item--wide" href="https://city-talks.gr/" target="_blank" rel="noopener noreferrer" aria-label="Άνοιγμα City Talks">
              <img src="assets/logos/city-talks.png" alt="City Talks" width="600" height="150" decoding="async" />
            </a>
            <a class="logo-item logo-item--wide" href="https://aandrew-kl.github.io/powerserv-website/" target="_blank" rel="noopener noreferrer" aria-label="Άνοιγμα PowerServ">
              <img src="assets/logos/powerserv.png" alt="PowerServ" width="4398" height="1292" decoding="async" />
            </a>

            <a class="logo-item logo-item--lockup logo-item--alysis" href="https://alysisai.com/" target="_blank" rel="noopener noreferrer" aria-label="Άνοιγμα Alysis AI">
              <img src="assets/logos/alysis-ai.png" alt="" width="464" height="432" decoding="async" />
              <span>Alysis AI</span>
            </a>
            <a class="logo-item logo-item--lockup logo-item--sylliptor" href="https://sylliptor.alysisai.com/" target="_blank" rel="noopener noreferrer" aria-label="Άνοιγμα Sylliptor">
              <img class="logo-img--pixel" src="assets/logos/sylliptor.png" alt="" width="407" height="347" decoding="async" />
              <span>Sylliptor</span>
            </a>
            <a class="logo-item logo-item--lockup logo-item--synesis" href="https://esynesis.eu/" target="_blank" rel="noopener noreferrer" aria-label="Άνοιγμα Synesis Strategic Advisors">
              <img src="assets/logos/synesis.png" alt="" width="512" height="512" decoding="async" />
              <span><strong>Synesis</strong><small>Strategic Advisors</small></span>
            </a>
            <a class="logo-item logo-item--wide" href="https://city-talks.gr/" target="_blank" rel="noopener noreferrer" aria-label="Άνοιγμα City Talks">
              <img src="assets/logos/city-talks.png" alt="" width="600" height="150" decoding="async" />
            </a>
            <a class="logo-item logo-item--wide" href="https://aandrew-kl.github.io/powerserv-website/" target="_blank" rel="noopener noreferrer" aria-label="Άνοιγμα PowerServ">
              <img src="assets/logos/powerserv.png" alt="" width="4398" height="1292" decoding="async" />
            </a>
          </div>
        </div>

        <div class="services-cta">
          <a class="services-button" href="#services" aria-label="Μετάβαση στις υπηρεσίες">
            <span>Services</span>
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <path d="M4 10h10.5M10.5 5.5 15 10l-4.5 4.5" />
            </svg>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
